<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assunção de Viatura | SISGEF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Diário de Bordo Digital - Vistoria Tática</h1>
        <nav>
            <ul>
                <li><a href="index.html">Voltar ao Hub</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- INSERIR AQUI: Toast de confirmação -->
        <div class="toast">
            <span>Assunção de serviço gravada. Viatura liberada para o patrulhamento.</span>
            <span style="cursor:pointer; font-weight:bold;">X</span>
        </div>

        <section id="formulario-registro">
            <h2>Formulário de Entrada</h2>
            <form action="/submit" method="POST">
                <fieldset>
                    <legend>Identificação Operacional</legend>
                    <label for="cpf">CPF do Patrulheiro:</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00" required>

                    <label for="telefone">Telefone de Contato (Guarnição/Fixo):</label>
                    <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" title="Formato: (00) 00000-0000" required>

                    <label for="cep">CEP da Base/Posto:</label>
                    <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" title="Formato: 00000-000" required>
                </fieldset>

                <fieldset>
                    <legend>Checklist de 1º Escalão</legend>
                    <label for="hodometro">Hodômetro Atual (Quilometragem):</label>
                    <input type="number" id="hodometro" name="hodometro" required>

                    <label for="assuncao">Data e Hora da Assunção de Serviço:</label>
                    <input type="datetime-local" id="assuncao" name="assuncao" required>

                    <label for="email">E-mail Institucional do Operador:</label>
                    <input type="email" id="email" name="email" required>
                </fieldset>

                <fieldset>
                    <legend>Registro de Sinistros</legend>
                    <details>
                        <summary>Reportar avaria constatada</summary>
                        <label for="foto-avaria">Upload Fotográfico de Avaria:</label>
                        <input type="file" id="foto-avaria" name="foto-avaria" accept="image/*">
                    </details>
                </fieldset>

                <button type="submit">Gravar Assunção de Serviço</button>
            </form>
        </section>
    </main>
</body>
</html>
